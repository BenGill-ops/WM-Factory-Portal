<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<!-- Saw Bench: cut sheets and pick sheets for the saw screen.
     Shown inside index.html (Saw Bench page) in an iframe, and opened on its own
     full-screen on the touch screen at the saw. Kept in its own file so its
     styles and scripts can't clash with the portal. -->
<title>Saw Bench — Window Makers</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap">
<style>
/* Built for a 22in touch screen read from arm's length with dusty hands:
   big tabular numbers, 56px+ touch targets, nothing that needs a hover. */
:root{
  --bg:#eeefec; --surface:#ffffff; --sunk:#e3e5df; --line:#d5d8d0;
  --fg:#161616; --muted:#5f6660; --ink:#1c1c1c;
  --green:#4a9a0f; --green-dark:#356f0a; --green-soft:#e3f2d3;
  --amber:#a4510b; --amber-soft:#fbead6; --red:#b3261e; --red-soft:#fbe3e1;
  --alu:#c9cdc6; --waste:#f0d9b5;
  --tap:56px;
}
*{box-sizing:border-box}
html{font-size:17px}
@media (min-width:1000px){html{font-size:18px}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:"DM Sans",system-ui,sans-serif;line-height:1.35;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{height:100%;display:flex;flex-direction:column}

/* ── top bar ── */
.top{background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;flex:none;min-height:68px}
.top h1{font-size:1.25rem;font-weight:700;margin:0;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .sub{color:rgba(255,255,255,.62);font-size:.8rem;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .grow{flex:1;min-width:0}
.tbtn{min-height:var(--tap);min-width:var(--tap);padding:0 16px;border-radius:10px;background:rgba(255,255,255,.1);color:#fff;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.tbtn:active{background:rgba(255,255,255,.22)}
.tbtn svg{width:22px;height:22px;flex:none}
.tabs{display:flex;background:rgba(255,255,255,.1);border-radius:12px;padding:4px;gap:4px}
.tab{min-height:48px;padding:0 22px;border-radius:9px;color:rgba(255,255,255,.75);font-weight:700;font-size:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.tab small{font-size:.68rem;font-weight:500;opacity:.8}
.tab.on{background:#fff;color:var(--ink)}

.main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.pad{padding:16px;max-width:1500px;margin:0 auto}
.note{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:12px 14px;font-weight:600;margin-bottom:14px}
.note.red{background:var(--red-soft);color:var(--red)}
.note.ok{background:var(--green-soft);color:var(--green-dark)}
.empty{text-align:center;color:var(--muted);padding:56px 20px;font-size:1.05rem}
.empty b{display:block;color:var(--fg);font-size:1.3rem;margin-bottom:6px}

.btn{min-height:var(--tap);padding:0 22px;border-radius:10px;background:var(--surface);border:2px solid var(--line);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{background:var(--sunk)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:active{background:var(--green-dark)}
.btn.sm{min-height:44px;padding:0 14px;font-size:.85rem}
.btn[disabled]{opacity:.45;pointer-events:none}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.odd{background:#1c1c1c;color:#fff}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.green{background:var(--green-soft);color:var(--green-dark)}
.tag.red{background:var(--red-soft);color:var(--red)}

/* ── job list ── */
.jobs{display:grid;gap:12px}
.job{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 18px;align-items:center;text-align:left;width:100%;background:var(--surface);border-radius:14px;padding:16px 18px;border:2px solid transparent;min-height:96px}
.job:active{border-color:var(--green)}
.job .q{font-size:1.7rem;font-weight:800;line-height:1}
.job .t{font-size:1.05rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.job .m{color:var(--muted);font-size:.8rem}
.job .stats{display:flex;gap:22px;text-align:right}
.job .stats b{display:block;font-size:1.35rem;font-weight:800;line-height:1.1}
.job .stats span{font-size:.72rem;color:var(--muted);font-weight:600}
.meter{grid-column:1/-1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--green);border-radius:99px}

/* ── load sheets (office) ── */
.drop{border:3px dashed var(--line);border-radius:14px;padding:26px 20px;text-align:center;background:var(--surface);margin-bottom:18px}
.drop.over{border-color:var(--green);background:var(--green-soft)}
.drop b{font-size:1.1rem}
.drop p{margin:6px 0 14px;color:var(--muted);font-size:.9rem}
.imp{background:var(--surface);border-radius:14px;padding:18px;margin-bottom:18px;border:2px solid var(--green)}
.imp h2{margin:0 0 4px;font-size:1.2rem}
.imp .files{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:14px 0}
.imp .f{background:var(--bg);border-radius:10px;padding:12px 14px}
.imp .f b{display:block}
.imp .f span{color:var(--muted);font-size:.85rem}
.imp .f.miss{border:2px dashed var(--line);background:none;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:600}
.field input,.field textarea,.field select{font:inherit;font-size:1rem;color:var(--fg);padding:12px;border:2px solid var(--line);border-radius:10px;background:#fff;min-height:var(--tap);width:100%}
.rowx{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}

/* ── pick sheet ── */
.bar2{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{min-height:48px;padding:0 18px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:.9rem}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pick{display:grid;gap:8px}
.pl{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 18px;align-items:center;background:var(--surface);border-radius:12px;padding:10px 12px 10px 16px;border-left:8px solid var(--line)}
.pl.ok{border-left-color:var(--green)}
.pl.short{border-left-color:var(--amber)}
.pl .code{font-size:1.45rem;font-weight:800;line-height:1.1}
.pl .desc{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:.85rem;color:var(--muted)}
.pl .need{text-align:center;min-width:92px}
.pl .need b{display:block;font-size:2rem;font-weight:800;line-height:1}
.pl .need span{font-size:.72rem;color:var(--muted);font-weight:600}
.step{display:flex;align-items:center;gap:6px}
.sb{width:var(--tap);height:var(--tap);border-radius:10px;background:var(--bg);border:2px solid var(--line);font-size:1.6rem;font-weight:700;display:grid;place-items:center;line-height:1}
.sb:active{background:var(--sunk)}
.sb.wide{width:auto;padding:0 16px;font-size:.9rem}
.sb.all.on{background:var(--green);border-color:var(--green);color:#fff}
.sb.none.on{background:var(--amber);border-color:var(--amber);color:#fff}
.have{min-width:74px;text-align:center}
.have b{display:block;font-size:1.8rem;font-weight:800;line-height:1}
.have span{font-size:.72rem;color:var(--muted);font-weight:600}
.have.blank b{color:var(--line)}
.res{grid-column:1/-1;font-weight:700;font-size:.9rem;color:var(--amber);display:none}
.pl.short .res{display:block}
@media (max-width:820px){.pl{grid-template-columns:minmax(0,1fr) auto}.step{grid-column:1/-1;justify-content:flex-end}}
.foot{flex:none;background:var(--surface);border-top:2px solid var(--line);padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.foot .sum{flex:1;min-width:200px;font-weight:700;font-size:1.05rem}
.foot .sum small{display:block;font-weight:500;color:var(--muted);font-size:.8rem}
.order{background:var(--surface);border-radius:12px;padding:14px 16px;margin-bottom:14px;border:2px solid var(--amber)}
.order.done{border-color:var(--green)}
.order h2{margin:0 0 2px;font-size:1.1rem}
.order table{border-collapse:collapse;width:100%;margin-top:10px;font-size:.95rem}
.order th{text-align:left;font-size:.72rem;color:var(--muted);font-weight:700;padding:4px 10px 4px 0;border-bottom:2px solid var(--line)}
.order td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line)}
.order td.r,.order th.r{text-align:right}

/* ── cutting plan ── */
.cut{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}
.rail{overflow:auto;background:var(--surface);border-right:2px solid var(--line);padding:8px}
.g{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;padding:10px 12px;border-radius:10px;min-height:var(--tap);align-items:center}
.g .c{font-weight:800;font-size:1.05rem;line-height:1.1}
.g .d{grid-column:1;font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g .n{grid-row:1/3;grid-column:2;font-weight:700;font-size:.9rem;color:var(--muted)}
.g.on{background:var(--ink);color:#fff}
.g.on .d,.g.on .n{color:rgba(255,255,255,.7)}
.g.fin .c{color:var(--green-dark)}
.g.fin .n{color:var(--green-dark)}
.g.on.fin .c,.g.on.fin .n{color:#b6e68c}
.bars{overflow:auto;padding:16px}
.ghead{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.ghead .code{font-size:2.4rem;font-weight:800;line-height:1}
.ghead .desc{font-size:1.2rem;font-weight:600}
.ghead .grow{flex:1}
.bc{background:var(--surface);border-radius:14px;margin-bottom:14px;overflow:hidden;border:2px solid transparent}
.bc.done{opacity:.6}
.bc.next{border-color:var(--green)}
.bh{display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px;flex-wrap:wrap}
.bh .bn{font-size:1.35rem;font-weight:800}
.bh .bl{color:var(--muted);font-weight:600}
.bh .grow{flex:1}
.tick{min-height:var(--tap);min-width:150px;padding:0 20px;border-radius:10px;border:2px solid var(--green);color:var(--green-dark);font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#fff}
.tick svg{width:24px;height:24px}
.tick.on{background:var(--green);color:#fff}
/* the bar drawn to scale: aluminium offcut on the left, cuts in order, waste hatched */
.strip{display:flex;height:34px;margin:0 16px 4px;border-radius:4px;overflow:hidden;background:var(--alu)}
.strip i{display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:700;color:#2b2f2a;border-right:2px solid #fff;min-width:3px;overflow:hidden;white-space:nowrap}
.strip i.w{background:repeating-linear-gradient(135deg,var(--waste) 0 7px,#e6c896 7px 14px);border-right:0;color:#6b4a14}
.cuts{width:100%;border-collapse:collapse}
.cuts th{font-size:.72rem;color:var(--muted);font-weight:700;padding:8px 10px 4px;text-align:center}
.cuts td{padding:8px 10px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}
.cuts .sz{font-size:2.1rem;font-weight:800;line-height:1;white-space:nowrap}
.cuts .sz small{font-size:.9rem;font-weight:600;color:var(--muted)}
.cuts .ang{font-size:1.25rem;font-weight:700;min-width:84px}
.cuts .ang.sq{color:var(--line);font-weight:500}
.cuts .qty{font-size:1.5rem;font-weight:800}
.cuts .itm{font-weight:700;color:var(--muted);white-space:nowrap}
.cuts tr.many .qty{color:var(--amber)}
@media (max-width:900px){
  .cut{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .rail{display:flex;gap:6px;border-right:0;border-bottom:2px solid var(--line);overflow-x:auto}
  .g{width:auto;flex:none;min-width:150px}
  .cuts .sz{font-size:1.7rem}
}

/* ── item summary and items on hold ── */
.cutwrap{overflow:hidden;display:flex;flex-direction:column}
.cutwrap .cut{flex:1;min-height:0;height:auto}
.items{flex:none;background:var(--surface);border-bottom:2px solid var(--line);padding:10px 16px}
.ihead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ihead span{color:var(--muted);font-size:.85rem}
.ihead .grow{flex:1}
.ilist{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;max-height:30vh;overflow:auto}
.it{min-width:68px;min-height:var(--tap);padding:4px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.it b{font-size:1.25rem;font-weight:800}
.it small{font-size:.68rem;font-weight:600;color:var(--muted)}
.it.fin{border-color:var(--green);background:var(--green-soft)}
.it.fin small{color:var(--green-dark)}
.it.hold{border-color:var(--amber);background:var(--amber-soft);border-style:dashed}
.it.hold b{text-decoration:line-through;color:var(--amber)}
.it.hold small{color:var(--amber)}
button.it:active{background:var(--sunk)}
.cuts tr.hold td{background:var(--amber-soft)}
.cuts tr.hold .sz,.cuts tr.hold .ang,.cuts tr.hold .qty{text-decoration:line-through;color:var(--amber);opacity:.75}
.cuts tr.was .sz,.cuts tr.was .ang,.cuts tr.was .qty{opacity:.35}
.strip i.h{background:repeating-linear-gradient(90deg,var(--amber-soft) 0 5px,#f3cfa3 5px 10px);color:var(--amber)}
.bh .tag{white-space:normal}
.g.held .c,.g.held .n{color:var(--amber)}
.g.on.held .c,.g.on.held .n{color:#f6c58e}
.heldbars{background:var(--amber-soft);color:var(--amber);border-radius:12px;padding:12px 16px;margin-bottom:14px;border:2px dashed var(--amber)}

/* ── overlays ── */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}
.dlg{background:#fff;border-radius:16px;padding:22px;max-width:520px;width:100%}
.dlg h2{margin:0 0 8px;font-size:1.25rem}
.dlg p{margin:0 0 16px;color:var(--muted)}
.dlg .rowx{justify-content:flex-end}
.pdf{position:fixed;inset:0;background:#3a3d39;z-index:60;display:flex;flex-direction:column}
.pdf .pbar{flex:none;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--ink);color:#fff}
.pdf .pages{flex:1;overflow:auto;padding:16px;text-align:center}
.pdf canvas{max-width:100%;height:auto;background:#fff;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.login{max-width:420px;margin:8vh auto;background:var(--surface);border-radius:16px;padding:26px;display:grid;gap:14px}
.login h2{margin:0;font-size:1.4rem}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:12px;font-weight:700;z-index:70;max-width:90vw;text-align:center}
.toast.bad{background:var(--red)}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
</style></head>
<body><div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// ── vQuote report readers ─────────────────────────────────────────────────────
// Both reports are read by position: every piece of text is matched to the
// column heading it sits under, so an L\Cut angle can't be mistaken for an R\Cut.
// Input: pages = [[{s:text, x:left, y:baseline, w:width}]] straight from pdf.js.
const mmNum=t=>{const m=/^(-?[\d,]+(?:\.\d+)?)\s*mm$/i.exec(String(t).trim());return m?Math.round(parseFloat(m[1].replace(/,/g,''))):null};
const isInt=t=>/^\d+$/.test(String(t).trim());
function toLines(items){
  const rows=[];
  items.filter(i=>i.s&&i.s.trim()&&!/^(-{2,}\s*)+$/.test(i.s.trim())).sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{
    const r=rows.find(r=>Math.abs(r.y-i.y)<=3);
    if(r)r.items.push(i);else rows.push({y:i.y,items:[i]});
  });
  rows.forEach(r=>r.items.sort((a,b)=>a.x-b.x));
  return rows;
}
const lineText=r=>r.items.map(i=>i.s.trim()).join(' ');
function reportKind(pages){
  const t=(pages[0]||[]).map(i=>i.s).join(' ').toUpperCase();
  if(t.includes('OPTIMISED CUTTING PLAN'))return'cut';
  if(t.includes('EXTRUSION BAR SUMMARY'))return'pick';
  return null;
}
function readMeta(pages){
  const m={title:'',customer:'',quote_num:'',quote_version:'',job_ref:'',report_at:''};
  toLines(pages[0]||[]).slice(0,14).forEach(r=>{
    const it=r.items;
    it.forEach((i,k)=>{
      const s=i.s.trim(),nx=it[k+1]?it[k+1].s.trim():'';
      if(/^Date\/Time:?$/i.test(s))m.report_at=nx;
      if(/^Quote Title:?$/i.test(s)&&nx&&!/:$/.test(nx))m.title=nx;
      if(/^Customer Name:?$/i.test(s)&&nx&&!/:$/.test(nx))m.customer=nx;
      if(/^Job (Ref|No):?$/i.test(s)&&nx&&!/:$/.test(nx))m.job_ref=nx;
      const q=/^-(\d+)-$/.exec(s);if(q)m.quote_num=q[1];
      const v=/^-?Ver\s*(\d+)$/i.exec(s);if(v)m.quote_version=v[1];
    });
  });
  // vQuote prints the title and customer a line apart from their labels on some pages
  if(!m.title||!m.customer){
    const ls=toLines(pages[0]||[]).slice(0,14);
    const li=ls.findIndex(r=>/Quote Title/i.test(lineText(r)));
    if(li>=0){const near=[ls[li-1],ls[li],ls[li+1]].filter(Boolean).flatMap(r=>r.items).filter(i=>!/:$/.test(i.s.trim())&&!/^-/.test(i.s.trim()));
      if(!m.title){const a=near.filter(i=>i.x<300)[0];if(a)m.title=a.s.trim()}
      if(!m.customer){const b=near.filter(i=>i.x>=300)[0];if(b)m.customer=b.s.trim()}}
  }
  return m;
}
// Match each bit of text on a line to the nearest column heading.
function colsFrom(headerRow,names,fallback){
  const cols={};
  names.forEach(n=>{const h=headerRow&&headerRow.items.find(i=>i.s.trim().toLowerCase()===n.toLowerCase());cols[n]=h?h.x+h.w/2:fallback[n]});
  return cols;
}
function assign(row,cols){
  const out={};
  row.items.forEach(i=>{const c=i.x+i.w/2;let best=null,bd=1e9;
    for(const n in cols){const d=Math.abs(cols[n]-c);if(d<bd){bd=d;best=n}}
    out[best]=out[best]?out[best]+' '+i.s.trim():i.s.trim()});
  return out;
}
const PICK_COLS=['Extrusion','Description','Finish','Bar Length','Quantity'];
const PICK_FALL={Extrusion:46,Description:155,Finish:330,'Bar Length':480,Quantity:542};
function parsePick(pages){
  const lines=[];let cols=null;
  pages.forEach(items=>{
    toLines(items).forEach(r=>{
      const t=lineText(r);
      if(/^Extrusion\b/i.test(t)&&/Quantity/i.test(t)){cols=colsFrom(r,PICK_COLS,PICK_FALL);return}
      const bl=r.items.find(i=>mmNum(i.s)!==null&&i.x>400);
      const q=r.items.filter(i=>isInt(i.s)&&i.x>500).pop();
      if(!bl||!q)return;
      const left=r.items.filter(i=>i!==bl&&i!==q);
      const ext=left.filter(i=>i.x<120).map(i=>i.s.trim()).join(' ');
      const desc=left.filter(i=>i.x>=120&&i.x<300).map(i=>i.s.trim()).join(' ');
      const fin=left.filter(i=>i.x>=300).map(i=>i.s.trim()).join(' ');
      if(!ext)return;
      lines.push({extrusion:ext,description:desc,finish:fin,bar_length_mm:mmNum(bl.s),qty_needed:parseInt(q.s,10)});
    });
  });
  return lines;
}
const CUT_COLS=['Extrusion','Bar Length','Waste','Bar No.','L\\Cut','Size','R\\Cut','Quantity','Quote/Item'];
const CUT_FALL={Extrusion:49,'Bar Length':115,Waste:165,'Bar No.':288,'L\\Cut':347,Size:389,'R\\Cut':436,Quantity:490,'Quote/Item':542};
function parseCut(pages){
  const bars=[];let cols=Object.assign({},CUT_FALL),grp=null,gi=0,skipped=0;
  pages.forEach(items=>{
    toLines(items).forEach(r=>{
      const t=lineText(r);
      if(/^Extrusion\b/i.test(t)&&/Quote\/Item/i.test(t)){cols=colsFrom(r,CUT_COLS,CUT_FALL);return}
      if(/Total Bars:/i.test(t)){
        const d=r.items.find(i=>i.x<200&&!/Total Bars/i.test(i.s));
        const f=r.items.filter(i=>i.x>330&&!isInt(i.s)).map(i=>i.s.trim()).join(' ');
        const n=r.items.find(i=>isInt(i.s)&&i.x>250&&i.x<330);
        grp={description:d?d.s.trim():'',finish:f,total:n?parseInt(n.s,10):null,gi:++gi};return;
      }
      const a=assign(r,cols);
      const len=mmNum(a['Bar Length']||''),size=mmNum(a.Size||'');
      if(len===null||size===null){if(/\d+\/\d+$/.test(t)&&/mm/.test(t))skipped++;return}
      const barNo=parseInt(a['Bar No.'],10),qty=parseInt(a.Quantity,10);
      if(!(barNo>0)||!(qty>0)||!a.Extrusion){skipped++;return}
      if(!grp)grp={description:'',finish:'',total:null,gi:++gi};
      let b=bars.find(b=>b.gi===grp.gi&&b.bar_no===barNo&&b.bar_length_mm===len);
      if(!b){b={gi:grp.gi,extrusion:a.Extrusion,description:grp.description,finish:grp.finish,bar_length_mm:len,bar_no:barNo,waste_mm:mmNum(a.Waste||''),cuts:[]};bars.push(b)}
      b.cuts.push({l:a['L\\Cut']||'',size:size,r:a['R\\Cut']||'',qty:qty,item:a['Quote/Item']||''});
    });
  });
  bars.forEach((b,i)=>{b.sort_order=i;delete b.gi});
  bars.skipped=skipped;
  return bars;
}
// Does every pick line have that many bars on the cutting plan?
function crossCheck(pick,bars){
  const n={};bars.forEach(b=>{const k=b.extrusion+'|'+b.bar_length_mm;n[k]=(n[k]||0)+1});
  const diffs=[];
  pick.forEach(p=>{const k=p.extrusion+'|'+p.bar_length_mm;if((n[k]||0)!==p.qty_needed)diffs.push({extrusion:p.extrusion,bar_length_mm:p.bar_length_mm,pick:p.qty_needed,plan:n[k]||0});delete n[k]});
  Object.keys(n).forEach(k=>{const[e,l]=k.split('|');diffs.push({extrusion:e,bar_length_mm:+l,pick:0,plan:n[k]})});
  return diffs;
}

// Items on hold: the office switches an item off (say its size isn't confirmed) and its
// pieces come off the cut sheet until it is switched back on.
const heldSet=()=>new Set((S.job&&S.job.held_items)||[]);
const itemNo=it=>{const m=/(\d+)$/.exec(it||'');return m?+m[1]:1e9};
// todo = cut it; hold = every piece on it is on hold; done = cut;
// more = cut earlier while some pieces were on hold, and those pieces are now back on.
function barState(b,H){
  H=H||heldSet();const heldIdx=[];b.cuts.forEach((c,i)=>{if(H.has(c.item))heldIdx.push(i)});
  if(!b.done)return{st:heldIdx.length&&heldIdx.length===b.cuts.length?'hold':'todo',heldIdx:heldIdx,out:[]};
  const out=(b.skipped||[]).filter(i=>b.cuts[i]&&!H.has(b.cuts[i].item));
  return{st:out.length?'more':'done',heldIdx:heldIdx,out:out};
}
function barCounts(bars){const H=heldSet();let total=0,done=0,hold=0;bars.forEach(b=>{const s=barState(b,H).st;if(s==='hold')hold++;else{total++;if(s==='done')done++}});return{total:total,done:done,hold:hold}}
function itemStats(){

  S.bars.forEach(b=>b.cuts.forEach((c,i)=>{const k=c.item||'';const o=m[k]||(m[k]={item:k,total:0,cut:0});o.total+=c.qty;if(b.done&&!(b.skipped||[]).includes(i))o.cut+=c.qty}));
  return Object.values(m).sort((a,b)=>itemNo(a.item)-itemNo(b.item)||String(a.item).localeCompare(b.item));
}

    '<div class="tabs" role="tablist"><button class="tab'+(S.tab==='pick'?' on':'')+'" role="tab" aria-selected="'+(S.tab==='pick')+'" data-act="tab" data-v="pick">Pick<small class="num" id="tpick">'+counted+' of '+S.pick.length+'</small></button>'+
    '<button class="tab'+(S.tab==='cut'?' on':'')+'" role="tab" aria-selected="'+(S.tab==='cut')+'" data-act="tab" data-v="cut">Cut<small class="num" id="tcut">'+bc.done+' of '+bc.total+'</small></button></div>'+
    '<button class="tbtn" data-act="sheets" aria-label="Sheets and job options">'+ICON.doc+'</button></div>';
  if(S.loading)return h+'<div class="main"><div class="empty">Loading…</div></div>';
  if(S.err)return h+'<div class="main"><div class="pad"><div class="note red">'+esc(S.err)+'</div></div></div>';
  if(S.tab==='pick'){
    if(!S.pick.length)return h+'<div class="main"><div class="empty"><b>No pick sheet loaded for this job</b>The office adds it by dropping the Extrusion Bar Summary PDF on the Saw Bench page.</div></div>';
    const mf=mainFinish();
    const list=S.pick.filter(l=>S.filter==='all'||(S.filter==='todo'&&l.qty_in_stock==null)||(S.filter==='short'&&shortOf(l)>0));
    const hi=[...heldSet()].sort((a,b)=>itemNo(a)-itemNo(b));
    h+='<div class="main"><div class="pad">'+orderHTML()+(hi.length?'<div class="note">'+hi.map(itemLabel).join(', ')+(hi.length>1?' are':' is')+' on hold on the cut sheet. This pick sheet still counts the bars for '+(hi.length>1?'them':'it')+'.</div>':'')+
      '<div class="bar2">'+[['all','All '+S.pick.length],['todo','Still to count'],['short','Short']].map(c=>'<button class="chip'+(S.filter===c[0]?' on':'')+'" data-act="filter" data-v="'+c[0]+'">'+c[1]+'</button>').join('')+'</div>'+
      (list.length?'<div class="pick">'+list.map(l=>pickRow(l,mf)).join('')+'</div>':'<div class="empty">'+(S.filter==='todo'?'<b>Every line is counted</b>Tap Send to office below.':'Nothing short.')+'</div>')+
      '</div></div><div class="foot" id="foot">'+footHTML()+'</div>';
    return h;
  }
  if(!S.bars.length)return h+'<div class="main"><div class="empty"><b>No cutting plan loaded for this job</b>The office adds it by dropping the Optimised Cutting Plan PDF on the Saw Bench page.</div></div>';
  const open=g=>g.bars.some(b=>{const s=barState(b).st;return s==='todo'||s==='more'});
  if(!S.grp||!gs.find(g=>g.key===S.grp))S.grp=(gs.find(open)||gs[0]).key;
  h+='<div class="main cutwrap">'+itemsHTML()+'<div class="cut"><nav class="rail" aria-label="Extrusions">'+gs.map(railBtn).join('')+'</nav><div class="bars" id="bars">'+groupHTML(gs)+'</div></div></div>';
  return h;
}

    '<div class="need"><b class="num">'+l.qty_needed+'</b><span>needed</span></div>'+
    '<div class="step"><button class="sb wide none'+(l.qty_in_stock===0?' on':'')+'" data-act="pk" data-id="'+l.id+'" data-v="none">None</button>'+

function footHTML(){
  const j=S.job,counted=S.pick.filter(l=>l.qty_in_stock!=null).length,short=S.pick.reduce((a,l)=>a+shortOf(l),0);
  const changed=j.pick_sent_at&&S.pick.some(l=>l.checked_at&&l.checked_at>j.pick_sent_at);

  const sub=j.pick_sent_at?(changed?'Counts changed since it was sent. Send it again.':'Sent to the office '+when(j.pick_sent_at)):(counted<S.pick.length&&short?plural(short,'bar')+' short so far':'');
  return '<div class="sum">'+head+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'+
    '<button class="btn pri" data-act="send"'+(S.busy||!counted?' disabled':'')+'>'+(S.busy?'Sending…':(j.pick_sent_at?'Send again':'Send to office'))+'</button>';

function orderHTML(){
  const j=S.job;if(!j.pick_sent_at)return'';
  const sh=S.pick.filter(l=>shortOf(l)>0),n=sh.reduce((a,l)=>a+shortOf(l),0);
  let h='<div class="order'+(j.ordered_at||!n?' done':'')+'"><div class="rowx" style="align-items:center"><div style="flex:1;min-width:200px"><h2>'+(n?'To order: '+plural(n,'bar'):'Nothing to order')+'</h2>'+
    '<div style="color:var(--muted);font-size:.85rem">Sent by '+esc(j.pick_sent_by||'the saw bench')+', '+when(j.pick_sent_at)+(j.ordered_at?'. Ordered by '+esc(j.ordered_by||'')+', '+when(j.ordered_at):'')+'</div></div>';
  if(n)h+='<button class="btn sm" data-act="copy">Copy list</button>';
  if(n&&isSup())h+=j.ordered_at?'<button class="btn sm" data-act="ordered" data-v="0">Not ordered yet</button>':'<button class="btn sm pri" data-act="ordered" data-v="1">Mark ordered</button>';

  if(n)h+='<table><tr><th>Extrusion</th><th>Description</th><th>Finish</th><th class="r">Bar</th><th class="r">Need</th><th class="r">Have</th><th class="r">Order</th></tr>'+
    sh.map(l=>'<tr><td><b class="num">'+esc(l.extrusion)+'</b></td><td>'+esc(l.description)+'</td><td>'+esc(l.finish)+'</td><td class="r num">'+mm(l.bar_length_mm)+'</td><td class="r num">'+l.qty_needed+'</td><td class="r num">'+l.qty_in_stock+'</td><td class="r num"><b>'+shortOf(l)+'</b></td></tr>').join('')+'</table>';

}
function railBtn(g){
  const c=barCounts(g.bars),fin=c.total>0&&c.done===c.total,allHold=!c.total;
  return '<button class="g'+(g.key===S.grp?' on':'')+(fin?' fin':'')+(allHold?' held':'')+'" id="g'+g.bars[0].id+'" data-act="grp" data-v="'+esc(g.key)+'"'+(g.key===S.grp?' aria-current="true"':'')+'><span class="c num">'+esc(g.code)+'</span><span class="d">'+esc(g.desc)+'</span><span class="n num">'+(allHold?'On hold':fin?'Done':c.done+'/'+c.total)+'</span></button>';
}
function groupHTML(gs){
  const g=gs.find(x=>x.key===S.grp),mf=mainFinish();
  const H=heldSet(),isOpen=b=>{const s=barState(b,H).st;return s==='todo'||s==='more'};
  const nextBar=g.bars.find(isOpen),i=gs.indexOf(g),nextG=gs.slice(i+1).concat(gs.slice(0,i)).find(x=>x.bars.some(isOpen));
  const onHold=g.bars.filter(b=>barState(b,H).st==='hold');
  const lens=[...new Set(g.bars.map(b=>b.bar_length_mm))];
  let h='<div class="ghead"><div class="code num">'+esc(g.code)+'</div><div><div class="desc">'+esc(g.desc)+'</div><span class="tag'+(g.finish!==mf?' odd':'')+'">'+esc(g.finish)+'</span></div><div class="grow"></div>'+
    '<div style="text-align:right;font-weight:700"><span class="num">'+plural(g.bars.length,'bar')+'</span><div style="color:var(--muted);font-size:.85rem;font-weight:600" class="num">'+lens.map(l=>g.bars.filter(b=>b.bar_length_mm===l).length+' × '+mm(l)+' mm').join(', ')+'</div></div></div>';
  h+=g.bars.filter(b=>barState(b,H).st!=='hold').map(b=>barCard(b,g,nextBar)).join('');
  if(onHold.length)h+='<div class="heldbars"><b>'+plural(onHold.length,'bar')+' on hold</b> '+esc(onHold.map(b=>'Bar '+b.bar_no).join(', '))+'. Every piece on '+(onHold.length>1?'them':'it')+' is for '+esc([...new Set(onHold.flatMap(b=>b.cuts.map(c=>c.item)))].sort((a,b)=>itemNo(a)-itemNo(b)).map(itemLabel).join(', '))+'.</div>';
  if(!nextBar)h+=nextG?'<button class="btn pri" style="width:100%;min-height:72px;font-size:1.1rem" data-act="grp" data-v="'+esc(nextG.key)+'">Next: '+esc(nextG.code)+' '+esc(nextG.desc)+'</button>'
    :'<div class="note ok" style="text-align:center;font-size:1.1rem">'+(barCounts(S.bars).hold?'Every bar is cut except the ones on hold.':'Every bar on this job is cut.')+'</div>';
  return h;
}
function barCard(b,g,nextBar){
  const bs=barState(b),H=heldSet();
  const used=b.cuts.reduce((a,c)=>a+c.size*c.qty,0),over=b.bar_length_mm&&used>b.bar_length_mm;
  let strip='';
  if(!over&&b.bar_length_mm){
    strip='<div class="strip" aria-hidden="true">';
    b.cuts.forEach(c=>{for(let k=0;k<c.qty;k++){const w=100*c.size/b.bar_length_mm;strip+='<i'+(H.has(c.item)?' class="h"':'')+' style="width:'+w.toFixed(2)+'%">'+(w>9?mm(c.size):'')+'</i>'}});
    strip+='<i class="w" style="flex:1"></i></div>';
  }
  const shown=bs.st==='done';
  let tags=over?'<span class="tag red">Cuts add up to '+mm(used)+' mm, longer than the bar. Check with the office.</span>':(b.waste_mm!=null?'<span class="tag num">'+mm(b.waste_mm)+' mm left over</span>':'');
  if(bs.st==='more')tags='<span class="tag amber">'+esc([...new Set(bs.out.map(i=>itemLabel(b.cuts[i].item)))].join(', '))+' is back on. Cut '+(bs.out.length>1?'these pieces':'this piece')+' from this bar’s offcut.</span>';
  else if(bs.heldIdx.length)tags+='<span class="tag amber">'+plural(bs.heldIdx.reduce((a,i)=>a+b.cuts[i].qty,0),'piece')+' on hold. Don’t cut '+(bs.heldIdx.length>1?'them':'it')+' yet.</span>';
  return '<section class="bc'+(shown?' done':'')+(nextBar&&nextBar.id===b.id?' next':'')+'" id="b'+b.id+'"><div class="bh"><span class="bn num">Bar '+b.bar_no+'</span><span class="bl num">'+mm(b.bar_length_mm)+' mm bar</span>'+tags+
    '<span class="grow"></span>'+(b.done&&b.done_by?'<span class="bl" style="font-size:.8rem">'+esc(b.done_by)+', '+when(b.done_at)+'</span>':'')+
    '<button class="tick'+(shown?' on':'')+'" data-act="tick" data-id="'+b.id+'" aria-pressed="'+shown+'">'+ICON.tick+(shown?'Cut':'Mark cut')+'</button></div>'+strip+
    '<table class="cuts"><tr><th>Left end</th><th>Length</th><th>Right end</th><th>Qty</th><th>For</th></tr>'+
    b.cuts.map((c,i)=>{
      const hold=H.has(c.item),was=bs.st==='more'&&!bs.out.includes(i)&&!hold;
      return '<tr class="'+(c.qty>1?'many':'')+(hold?' hold':'')+(was?' was':'')+'"><td class="ang num'+(c.l?'':' sq')+'">'+(c.l?esc(c.l):'square')+'</td><td class="sz num">'+mm(c.size)+' <small>mm</small></td>'+
      '<td class="ang num'+(c.r?'':' sq')+'">'+(c.r?esc(c.r):'square')+'</td><td class="qty num">× '+c.qty+'</td><td class="itm num">'+esc(itemLabel(c.item))+(hold?' <span class="tag amber">On hold</span>':was?' <span class="tag green">Cut</span>':'')+'</td></tr>'}).join('')+'</table></section>';
}
// The item summary across the top of the cut sheet. Supervisors and above tap an item to
// take it off the cut sheet (on hold) or put it back.
function itemsHTML(){
  const st=itemStats(),H=heldSet(),can=isSup();let shut=false;try{shut=localStorage.getItem('wm_saw_items')==='0'}catch(e){}
  const nHold=st.filter(x=>H.has(x.item)).length;
  let h='<div class="items"><div class="ihead"><b>'+plural(st.length,'item')+' on this cut sheet</b><span>'+(nHold?plural(nHold,'item')+' on hold':'All on')+(can&&!shut?'. Tap an item to take it off the cut sheet or put it back.':'')+'</span>'+
    '<span class="grow"></span><button class="btn sm" data-act="itemsfold" aria-expanded="'+!shut+'">'+(shut?'Show items':'Hide')+'</button></div>';
  const list=shut?st.filter(x=>H.has(x.item)):st;
  if(list.length)h+='<div class="ilist">'+list.map(x=>{
    const hold=H.has(x.item),fin=!hold&&x.cut>=x.total,lab=itemLabel(x.item).replace(/^Item /,'');
    const inner='<b class="num">'+esc(lab)+'</b><small class="num">'+(hold?'On hold':fin?'Cut':x.cut+'/'+x.total)+'</small>';
    return can?'<button class="it'+(hold?' hold':'')+(fin?' fin':'')+'" data-act="hold" data-v="'+esc(x.item)+'" aria-pressed="'+!hold+'" aria-label="Item '+esc(lab)+(hold?', on hold':', on the cut sheet')+'">'+inner+'</button>'
      :'<div class="it'+(hold?' hold':'')+(fin?' fin':'')+'">'+inner+'</div>'}).join('')+'</div>';
  return h+'</div>';
}

// ── actions ──────────────────────────────────────────────────────────────────
function setPick(id,how){
  const l=S.pick.find(x=>x.id===id);if(!l)return;
  let v=l.qty_in_stock;
  if(how==='all')v=v===l.qty_needed?null:l.qty_needed;
  else if(how==='none')v=v===0?null:0;
  else if(how==='minus')v=v==null?l.qty_needed-1:v-1;
  else if(how==='plus')v=v==null?1:v+1;
  if(v!=null)v=Math.max(0,Math.min(l.qty_needed,v));
  if(v===l.qty_in_stock)return;
  const before={qty_in_stock:l.qty_in_stock,checked_by:l.checked_by,checked_at:l.checked_at};
  l.qty_in_stock=v;l.checked_by=me().name||'';l.checked_at=new Date().toISOString();
  const el=$('#pl'+id);if(el)el.outerHTML=pickRow(l,mainFinish());
  $('#foot').innerHTML=footHTML();$('#tpick').textContent=S.pick.filter(x=>x.qty_in_stock!=null).length+' of '+S.pick.length;
  clearTimeout(pending[id]&&pending[id].t);
  const first=pending[id]?pending[id].before:before;
  pending[id]={before:first,t:setTimeout(async function(){
    delete pending[id];
    try{await rest('saw_pick_lines?id=eq.'+id,Object.assign({method:'PATCH',body:JSON.stringify({qty_in_stock:l.qty_in_stock,checked_by:l.checked_by,checked_at:l.checked_at})},QUIET))}
    catch(e){Object.assign(l,first);toast(failMsg(e),true);if(S.view==='job'&&S.tab==='pick')render(true)}
  },450)};
}
async function tickBar(id){
  const b=S.bars.find(x=>x.id===id);if(!b)return;
  const bs=barState(b);if(bs.st==='hold')return;
  const before={done:b.done,done_by:b.done_by,done_at:b.done_at,skipped:b.skipped};
  const now=new Date().toISOString(),who=me().name||'';
  if(bs.st==='todo'){b.done=true;b.skipped=bs.heldIdx;b.done_by=who;b.done_at=now}                        // pieces on hold are remembered as not cut
  else if(bs.st==='more'){b.skipped=(b.skipped||[]).filter(i=>!bs.out.includes(i));b.done_by=who;b.done_at=now}
  else{b.done=false;b.skipped=[];b.done_by=null;b.done_at=null}
  render(true);
  try{await rest('saw_bars?id=eq.'+id,Object.assign({method:'PATCH',body:JSON.stringify({done:b.done,done_by:b.done_by,done_at:b.done_at,skipped:b.skipped})},QUIET))}
  catch(e){Object.assign(b,before);toast(failMsg(e),true);render(true)}
}
async function toggleHold(item){
  if(!isSup())return;
  const cur=(S.job.held_items||[]).slice(),on=cur.includes(item),next=on?cur.filter(x=>x!==item):cur.concat(item);
  const pieces=S.bars.reduce((a,b)=>a+b.cuts.reduce((x,c)=>x+(c.item===item?c.qty:0),0),0);
  S.job.held_items=next;render(true);
  try{await rest('saw_jobs?id=eq.'+S.job.id,Object.assign({method:'PATCH',body:JSON.stringify({held_items:next,updated_at:new Date().toISOString()})},QUIET));
    toast(on?itemLabel(item)+' is back on the cut sheet.':itemLabel(item)+' is on hold. '+plural(pieces,'piece')+' taken off the cut sheet.')}
  catch(e){S.job.held_items=cur;toast(failMsg(e),true);render(true)}
}
async function sendPick(){
  const todo=S.pick.filter(l=>l.qty_in_stock==null).length,short=S.pick.reduce((a,l)=>a+shortOf(l),0);
  const a=await ask(short?'Send '+plural(short,'bar')+' to order?':'Tell the office everything is in stock?',
    todo?plural(todo,'line')+' not counted yet. They will be listed as not counted.':'The office gets this list in the portal and by email.','Send to office',
    '<label class="field">Note for the office (optional)<textarea rows="2">'+esc(S.job.pick_note||'')+'</textarea></label>');
  if(!a.ok)return;
  while(Object.keys(pending).length)await new Promise(r=>setTimeout(r,200));
  S.busy=true;$('#foot').innerHTML=footHTML();
  try{
    const patch={pick_sent_at:new Date().toISOString(),pick_sent_by:me().name||'',pick_note:a.text||null,ordered_at:null,ordered_by:null,updated_at:new Date().toISOString()};
    await rest('saw_jobs?id=eq.'+S.job.id,Object.assign({method:'PATCH',body:JSON.stringify(patch)},QUIET));
    Object.assign(S.job,patch);
    let mailed=false;
    try{const r=await api('/functions/v1/saw-pick-notify',{method:'POST',body:JSON.stringify({job_id:S.job.id})});mailed=!!(r&&r.ok)}catch(e){}
    toast(mailed?'Sent to the office.':'Saved in the portal, but the email did not send. Let the office know.',!mailed);
  }catch(e){toast(failMsg(e),true)}
  S.busy=false;render(true);
}
async function setOrdered(on){
  const patch={ordered_at:on?new Date().toISOString():null,ordered_by:on?(me().name||''):null};
  try{await rest('saw_jobs?id=eq.'+S.job.id,Object.assign({method:'PATCH',body:JSON.stringify(patch)},QUIET));Object.assign(S.job,patch);render(true)}
  catch(e){toast(failMsg(e),true)}
}
function copyOrder(){
  const j=S.job,rows=S.pick.filter(l=>shortOf(l)>0).map(l=>[l.extrusion,l.description,l.finish,mm(l.bar_length_mm)+' mm',shortOf(l)].join('\t'));
  const text='Quote '+(j.quote_num||'')+' '+(j.title||'')+'\nExtrusion\tDescription\tFinish\tBar length\tOrder\n'+rows.join('\n');
  (navigator.clipboard?navigator.clipboard.writeText(text):Promise.reject()).then(()=>toast('List copied.'),()=>toast('Could not copy on this device.',true));
}
function sheetsDialog(){
  const j=S.job,ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><h2>'+esc(j.quote_num||'')+' '+esc(j.title||'')+'</h2><p>'+
    (j.pick_report_at?'Pick sheet printed '+esc(j.pick_report_at)+'. ':'')+(j.cut_report_at?'Cutting plan printed '+esc(j.cut_report_at)+'.':'')+'</p><div style="display:grid;gap:10px">'+
    (j.pick_pdf?'<button class="btn" data-x="pick">View the pick sheet PDF</button>':'')+(j.cut_pdf?'<button class="btn" data-x="cut">View the cutting plan PDF</button>':'')+
    (j.status==='Done'?'<button class="btn" data-x="reopen">Put back on the bench</button>':'<button class="btn" data-x="finish">Finish job (take it off the bench)</button>')+
    (isMgr()?'<button class="btn" style="color:var(--red)" data-x="del">Delete this job</button>':'')+'<button class="btn pri" data-x="close">Close</button></div></div>';
  ov.addEventListener('click',async ev=>{
    const b=ev.target.closest('[data-x]');if(!b&&ev.target!==ov)return;const x=b?b.dataset.x:'close';ov.remove();
    if(x==='pick')viewPdf(j.pick_pdf,'Pick sheet');
    if(x==='cut')viewPdf(j.cut_pdf,'Cutting plan');
    if(x==='finish'||x==='reopen'){
      const c=barCounts(S.bars),left=c.total-c.done;
      if(x==='finish'&&left){const a=await ask('Finish with '+plural(left,'bar')+' not ticked?','The job comes off the saw bench. The office can put it back.','Finish job');if(!a.ok)return}
      try{await rest('saw_jobs?id=eq.'+j.id,Object.assign({method:'PATCH',body:JSON.stringify({status:x==='finish'?'Done':'Active',updated_at:new Date().toISOString()})},QUIET));
        if(x==='finish'){S.view='jobs';S.job=null;loadJobs()}else{j.status='Active';render(true)}}catch(e){toast(failMsg(e),true)}
    }
    if(x==='del'){const a=await ask('Delete quote '+(j.quote_num||'')+' from the saw bench?','Its pick counts and ticked bars are deleted too. This cannot be undone.','Delete job');if(!a.ok)return;
      try{await rest('saw_jobs?id=eq.'+j.id,Object.assign({method:'DELETE'},QUIET));S.view='jobs';S.job=null;loadJobs()}catch(e){toast(failMsg(e),true)}}
  });
  document.body.appendChild(ov);
}
async function viewPdf(path,title){
  const v=document.createElement('div');v.className='pdf';
  v.innerHTML='<div class="pbar"><button class="tbtn" data-x="close">'+ICON.back+' Back</button><b style="flex:1">'+esc(title)+'</b><span id="pcount"></span></div><div class="pages"><div class="empty" style="color:#fff">Opening…</div></div>';
  let open=true;v.querySelector('[data-x]').onclick=()=>{open=false;v.remove()};document.body.appendChild(v);
  try{
    const r=await fetch(SB+'/storage/v1/object/authenticated/saw-sheets/'+path.split('/').map(encodeURIComponent).join('/'),{headers:{apikey:ANON,Authorization:'Bearer '+token()}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;
    const pdf=await pdfjsLib.getDocument({data:await r.arrayBuffer()}).promise,host=v.querySelector('.pages');host.innerHTML='';
    const dpr=Math.min(2,window.devicePixelRatio||1);
    for(let n=1;n<=pdf.numPages&&open;n++){
      const p=await pdf.getPage(n),w=Math.min(host.clientWidth-32,1100),vp=p.getViewport({scale:w/p.getViewport({scale:1}).width*dpr});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.width=(vp.width/dpr)+'px';host.appendChild(c);
      await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;v.querySelector('#pcount').textContent=n+' of '+pdf.numPages;
    }
  }catch(e){const host=v.querySelector('.pages');if(host)host.innerHTML='<div class="empty" style="color:#fff"><b style="color:#fff">Could not open the PDF</b>Check the Wi-Fi and try again.</div>'}
}

// ── loading the vQuote PDFs (office) ─────────────────────────────────────────
async function pdfPages(file){
  pdfjsLib.GlobalWorkerOptions.workerSrc=PDFW;
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,pages=[];
  for(let n=1;n<=pdf.numPages;n++){const tc=await(await pdf.getPage(n)).getTextContent();pages.push(tc.items.map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width})))}
  return pages;
}
async function takeFiles(files){
  const list=[...files].filter(f=>/\.pdf$/i.test(f.name)||f.type==='application/pdf');
  if(!list.length)return toast('Those are not PDFs.',true);
  let m=S.imp||{meta:null,warn:[]};m.warn=[];
  for(const f of list){
    let pages;try{pages=await pdfPages(f)}catch(e){toast('Could not read '+f.name+'.',true);continue}
    const kind=reportKind(pages),meta=readMeta(pages);
    if(!kind){toast(f.name+' is not a pick sheet or cutting plan from vQuote.',true);continue}
    if(m.meta&&m.meta.quote_num&&meta.quote_num&&m.meta.quote_num!==meta.quote_num)m={meta:null,warn:[]};   // a different quote: start again
    if(kind==='pick'){m.pick=parsePick(pages);m.pickFile=f;m.pickMeta=meta}
    else{m.bars=parseCut(pages);m.cutFile=f;m.cutMeta=meta;if(m.bars.skipped)m.warn.push(plural(m.bars.skipped,'row')+' on the cutting plan could not be read. Check them against the PDF.')}
    m.meta=Object.assign({},m.meta||{},meta);
  }
  if(!m.pick&&!m.bars){S.imp=null;return render()}
  if(m.pickMeta&&m.cutMeta&&m.pickMeta.quote_version!==m.cutMeta.quote_version)m.warn.push('The pick sheet is version '+m.pickMeta.quote_version+' and the cutting plan is version '+m.cutMeta.quote_version+'.');
  if((m.pick&&!m.pick.length)||(m.bars&&!m.bars.length))m.warn.push('One of the sheets came through empty. Check the PDF.');
  m.diffs=m.pick&&m.bars?crossCheck(m.pick,m.bars):[];
  m.job_number=m.job_number||m.meta.job_ref||'';
  m.existing=null;
  try{const ex=await rest('saw_jobs?quote_num=eq.'+encodeURIComponent(m.meta.quote_num)+'&status=eq.Active&order=created_at.desc&limit=1');m.existing=ex&&ex[0]||null;if(m.existing&&!m.job_number)m.job_number=m.existing.job_number||''}catch(e){}
  S.imp=m;render();
}
async function upload(jobId,kind,file){
  const path=jobId+'/'+kind+'-'+Date.now()+'.pdf';
  const r=await fetch(SB+'/storage/v1/object/saw-sheets/'+path,{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+token(),'Content-Type':'application/pdf'},body:file});
  if(!r.ok){const e=new Error('upload');e.status=r.status;throw e}
  return path;
}
async function commitImport(){
  const m=S.imp;if(!m||S.busy)return;
  m.job_number=($('#impjob')||{}).value||'';
  S.busy=true;render();
  const POST=o=>({method:'POST',body:JSON.stringify(o),headers:{Prefer:'return=representation'}});
  try{
    const q=m.meta,now=new Date().toISOString();
    let job=m.existing;
    const head={quote_num:q.quote_num||null,quote_version:q.quote_version||null,job_number:m.job_number.trim()||null,title:q.title||null,customer:q.customer||null,updated_at:now};
    if(!job)job=(await rest('saw_jobs',POST(Object.assign({created_by_name:me().name||''},head))))[0];
    const patch=Object.assign({},head);
    if(m.pick){
      const old=m.existing?await restAll('saw_pick_lines?job_id=eq.'+job.id+'&order=sort_order'):[];
      const key=l=>l.extrusion+'|'+l.bar_length_mm,was={};old.forEach(l=>{was[key(l)]=l});
      const same=old.length===m.pick.length&&m.pick.every(l=>was[key(l)]&&was[key(l)].qty_needed===l.qty_needed);
      if(old.length)await rest('saw_pick_lines?job_id=eq.'+job.id,Object.assign({method:'DELETE'},QUIET));
      await rest('saw_pick_lines',Object.assign({method:'POST',body:JSON.stringify(m.pick.map((l,i)=>{const o=was[key(l)];const have=o&&o.qty_in_stock!=null?Math.min(o.qty_in_stock,l.qty_needed):null;
        return Object.assign({job_id:job.id,sort_order:i,qty_in_stock:have,checked_by:have!=null?o.checked_by:null,checked_at:have!=null?o.checked_at:null},l)}))},QUIET));
      patch.pick_pdf=await upload(job.id,'pick',m.pickFile);patch.pick_report_at=m.pickMeta.report_at||null;
      if(!same)Object.assign(patch,{pick_sent_at:null,pick_sent_by:null,ordered_at:null,ordered_by:null});
    }
    if(m.bars){
      const old=m.existing?await restAll('saw_bars?job_id=eq.'+job.id+'&order=sort_order'):[];
      const key=b=>[b.extrusion,b.bar_length_mm,b.bar_no,JSON.stringify(b.cuts.map(c=>[c.l,c.size,c.r,c.qty,c.item]))].join('|'),was={};old.forEach(b=>{was[key(b)]=b});
      if(old.length)await rest('saw_bars?job_id=eq.'+job.id,Object.assign({method:'DELETE'},QUIET));
      const rows=m.bars.map(b=>{const o=was[key(b)];return Object.assign({job_id:job.id,done:!!(o&&o.done),skipped:o&&o.done?(o.skipped||[]):[],done_by:o&&o.done?o.done_by:null,done_at:o&&o.done?o.done_at:null},b)});
      for(let i=0;i<rows.length;i+=400)await rest('saw_bars',Object.assign({method:'POST',body:JSON.stringify(rows.slice(i,i+400))},QUIET));
      patch.cut_pdf=await upload(job.id,'cut',m.cutFile);patch.cut_report_at=m.cutMeta.report_at||null;
    }
    await rest('saw_jobs?id=eq.'+job.id,Object.assign({method:'PATCH',body:JSON.stringify(patch)},QUIET));
    S.imp=null;S.busy=false;toast('Quote '+(q.quote_num||'')+' is on the saw bench.');loadJobs();
  }catch(e){S.busy=false;render();toast(e.status===401||e.status===403?'Not loaded — only supervisors and managers can load sheets. Sign in again if that is you.':'Not loaded — '+(e.message||'check the connection')+'. Try again.',true)}
}

// ── wiring ───────────────────────────────────────────────────────────────────
document.addEventListener('click',function(ev){
  lastTouch=Date.now();
  const b=ev.target.closest('[data-act]');if(!b||b.closest('.ov'))return;
  const a=b.dataset.act,v=b.dataset.v,id=+b.dataset.id;
  if(a==='reload')loadJobs();
  else if(a==='signout'){const s=readSess();if(s)fetch(SB+'/auth/v1/logout',{method:'POST',headers:{apikey:ANON,Authorization:'Bearer '+s.access_token}}).catch(()=>{});localStorage.removeItem('wm_session');localStorage.removeItem('wm_user');S.view='jobs';S.jobs=[];render()}
  else if(a==='showdone'){S.showDone=v==='1';loadJobs()}
  else if(a==='open')openJob(id);
  else if(a==='back'){S.view='jobs';S.job=null;loadJobs()}
  else if(a==='tab'){S.tab=v;render()}
  else if(a==='filter'){S.filter=v;render()}
  else if(a==='pk')setPick(id,v);
  else if(a==='send')sendPick();
  else if(a==='ordered')setOrdered(v==='1');
  else if(a==='copy')copyOrder();
  else if(a==='grp'){S.grp=v;render(true);const e=$('#bars');if(e)e.scrollTop=0;const on=$('.g.on');if(on&&on.scrollIntoView)on.scrollIntoView({block:'nearest',inline:'nearest'})}
  else if(a==='tick')tickBar(id);
  else if(a==='hold')toggleHold(v);
  else if(a==='itemsfold'){try{localStorage.setItem('wm_saw_items',localStorage.getItem('wm_saw_items')==='0'?'1':'0')}catch(e){}render(true)}
  else if(a==='sheets')sheetsDialog();
  else if(a==='choose'){const f=$('#files');if(f)f.click()}
  else if(a==='impcancel'){S.imp=null;render()}
  else if(a==='impgo')commitImport();
});
document.addEventListener('change',function(ev){if(ev.target.id==='files'&&ev.target.files.length)takeFiles(ev.target.files)});
document.addEventListener('submit',function(ev){if(ev.target.id==='login'){ev.preventDefault();doLogin()}});
['dragover','dragenter'].forEach(t=>document.addEventListener(t,function(ev){if(!isSup()||S.view!=='jobs')return;ev.preventDefault();const d=$('#drop');if(d)d.classList.add('over')}));
document.addEventListener('dragleave',function(ev){if(ev.relatedTarget)return;const d=$('#drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',function(ev){if(!isSup()||S.view!=='jobs')return;ev.preventDefault();const d=$('#drop');if(d)d.classList.remove('over');if(ev.dataTransfer&&ev.dataTransfer.files.length)takeFiles(ev.dataTransfer.files)});
window.addEventListener('storage',function(ev){if(ev.key==='wm_session'&&S.err==='signin'){S.err='';loadJobs()}});
wake();
if(signedIn())loadJobs();else render();
</script>
